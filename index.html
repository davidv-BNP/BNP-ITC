<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNP &middot; Warehouse TV Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:#0B0D10; }
  * { box-sizing:border-box; font-family:'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { width:100vw; height:100vh; overflow:hidden; }

  .board {
    --bg:#0B0D10; --panel:#14171C; --border:#262B33;
    --text:#F5F6F7; --sub:#8B93A1; --accent:#E8A33D; --accent-bg:rgba(232,163,61,0.14);
    --urgent:#E5484D; --urgent-bg:rgba(229,72,77,0.16); --ok:#3FB950; --ok-bg:rgba(63,185,80,0.14);
    --mgmt:#FF00E5; --mgmt-bg:rgba(255,0,229,0.16);
    --scale: 1; /* auto-fit: turned down by JS when active content would overflow */
    width:100vw; height:100vh; background:var(--bg); color:var(--text);
    padding:3vh 3.2vh 1.4vh 3.2vh; display:flex; flex-direction:column;
  }
  .topbar { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:0.16vh solid var(--border); padding-bottom:2vh; margin-bottom:2.2vh; flex:0 0 auto; }
  .zone-title { font-size:6vh; font-weight:800; margin:0; letter-spacing:-0.1vh; }
  .zone-sub { font-size:1.7vh; color:var(--sub); margin-top:0.5vh; font-weight:600; letter-spacing:0.05vh; }
  .clockwrap { text-align:right; }
  .clock { font-size:3.4vh; font-weight:800; }
  .date { font-size:1.5vh; color:var(--sub); margin-top:0.4vh; font-weight:600; letter-spacing:0.1vh; }

  .content { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; transition:opacity 0.25s ease; }

  .row-card { display:flex; align-items:center; gap:calc(var(--scale) * 2.4vh); background:var(--panel); border:0.15vh solid var(--border); border-radius:calc(var(--scale) * 1.6vh); padding:calc(var(--scale) * 2.2vh) calc(var(--scale) * 2.6vh); margin-bottom:calc(var(--scale) * 1.3vh); }
  .row-card.qt { border:0.1vh solid var(--urgent); border-left:0.5vh solid var(--urgent); background:var(--urgent-bg); }

  /* Manager-dashboard-driven states: In Process pulses a border in the same
     accent color as the number chip; Urgent turns the whole line red;
     Complete (Order Fulfillment only — everywhere else Complete removes the
     row entirely before it ever reaches this renderer) turns it green;
     See MGMT pulses the same way as In Process but in bright magenta —
     same animation timing, different color, its own keyframes since a
     CSS animation can't take a variable color per element. */
  @keyframes rowPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent); border-color: var(--accent); }
    50% { box-shadow: 0 0 calc(var(--scale) * 1.6vh) calc(var(--scale) * 0.15vh) var(--accent); border-color: var(--accent); }
  }
  @keyframes rowPulseMgmt {
    0%, 100% { box-shadow: 0 0 0 0 var(--mgmt); border-color: var(--mgmt); }
    50% { box-shadow: 0 0 calc(var(--scale) * 1.6vh) calc(var(--scale) * 0.15vh) var(--mgmt); border-color: var(--mgmt); }
  }
  .row-card.state-in-process { animation: rowPulse 1.6s ease-in-out infinite; }
  .row-card.state-complete-green { border-color: var(--ok); background: var(--ok-bg); }
  .row-card.state-urgent { border-color: var(--urgent); background: var(--urgent-bg); }
  .row-card.state-mgmt { animation: rowPulseMgmt 1.6s ease-in-out infinite; }
  .num-chip { flex:0 0 auto; min-width:calc(var(--scale) * 11vh); min-height:calc(var(--scale) * 11vh); max-width:calc(var(--scale) * 24vh); padding:calc(var(--scale) * 0.6vh) calc(var(--scale) * 1.2vh); border-radius:calc(var(--scale) * 1.8vh); background:var(--accent-bg); border:0.2vh solid var(--accent); display:flex; align-items:center; justify-content:center; font-size:calc(var(--scale) * 4.6vh); font-weight:800; color:var(--accent); text-align:center; line-height:1.05; overflow-wrap:break-word; word-break:break-word; white-space:normal; }
  .num-chip-wide { max-width:calc(var(--scale) * 34vh); font-size:calc(var(--scale) * 2.5vh); line-height:1.15; padding:calc(var(--scale) * 0.8vh) calc(var(--scale) * 1.8vh); }
  /* "AISLE x & y STREET NAME" zone chips (Prep Holding, and anywhere the
     same zone codes get typed — e.g. Order Fulfillment): the aisle letters
     on top, the street name smaller underneath, both centered in the same
     chip bubble. See zoneChipParts(). */
  .zone-chip-lines { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .zone-chip-top { font-size:calc(var(--scale) * 2.7vh); font-weight:800; line-height:1.15; white-space:nowrap; }
  .zone-chip-bottom { font-size:calc(var(--scale) * 1.5vh); font-weight:700; line-height:1.2; opacity:0.82; letter-spacing:0.03em; margin-top:calc(var(--scale) * 0.4vh); white-space:nowrap; }
  .row-main { flex:1 1 auto; min-width:0; }
  .row-desc { font-size:calc(var(--scale) * 4vh); font-weight:700; color:var(--text); line-height:1.1; }
  .row-meta { font-size:calc(var(--scale) * 1.7vh); color:var(--sub); margin-top:calc(var(--scale) * 0.6vh); font-weight:500; }
  .badge { flex:0 0 auto; padding:calc(var(--scale) * 0.7vh) calc(var(--scale) * 1.4vh); border-radius:999px; font-size:calc(var(--scale) * 1.2vh); font-weight:800; letter-spacing:0.1vh; text-transform:uppercase; white-space:nowrap; }
  .badge-urgent { background:var(--urgent-bg); color:var(--urgent); border:0.08vh solid var(--urgent); }

  /* Truck/vehicle info (Inbound & Outbound Docks) — its own chip pinned to
     the far right, matching the dock-# chip on the left, so it's easy to
     read and never shrinks the order description above it. */
  .side-chip { flex:0 0 auto; max-width:calc(var(--scale) * 22vh); padding:calc(var(--scale) * 1.2vh) calc(var(--scale) * 1.8vh); border-radius:calc(var(--scale) * 1.6vh); background:var(--accent-bg); border:0.2vh solid var(--accent); display:flex; flex-direction:column; align-items:flex-end; justify-content:center; text-align:right; }
  .side-chip-main { font-size:calc(var(--scale) * 2.4vh); font-weight:800; color:var(--accent); line-height:1.15; white-space:nowrap; }
  .side-chip-sub { font-size:calc(var(--scale) * 1.4vh); font-weight:700; color:var(--sub); margin-top:calc(var(--scale) * 0.4vh); white-space:nowrap; }

  /* Quick Turn: Qty/Item, In Order, and Out Order all matter, so they're
     all rendered at the same size (Qty/Item leads on its own line since
     it's read first, but nothing here is smaller than anything else). */
  .qt-line { font-size:calc(var(--scale) * 2.6vh); font-weight:700; color:var(--text); line-height:1.25; }
  .qt-line + .qt-line { margin-top:calc(var(--scale) * 0.3vh); }

  .section-label { font-size:calc(var(--scale) * 1.2vh); letter-spacing:0.22vh; color:var(--sub); font-weight:800; text-transform:uppercase; margin:0 0 calc(var(--scale) * 1vh) 0; }
  .section-label.qt { color:var(--urgent); }
  .open-wrap { display:flex; flex-wrap:wrap; gap:calc(var(--scale) * 0.9vh); }
  .open-chip { padding:calc(var(--scale) * 0.8vh) calc(var(--scale) * 1.4vh); border-radius:calc(var(--scale) * 0.9vh); border:0.13vh dashed var(--border); color:var(--sub); font-size:calc(var(--scale) * 1.35vh); font-weight:700; }

  .grid-zones { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:1fr; gap:calc(var(--scale) * 1.4vh); }
  .zone-card { background:var(--panel); border:0.1vh solid var(--border); border-radius:calc(var(--scale) * 1.2vh); padding:calc(var(--scale) * 2vh) calc(var(--scale) * 2.2vh); display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
  .zone-name { font-size:calc(var(--scale) * 2.6vh); font-weight:800; color:var(--text); letter-spacing:0.03vh; }
  .zone-status-empty { font-size:calc(var(--scale) * 1.6vh); color:#4a5160; font-weight:700; margin-top:calc(var(--scale) * 0.8vh); letter-spacing:0.05vh; text-transform:uppercase; }

  .bottombar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding-top:1.2vh; gap:1.4vh; }
  .bottombar img { height:6.5vh; width:auto; max-width:26vh; object-fit:contain; opacity:0.92; }
  .footer-note { font-size:1.2vh; color:#3d4552; font-weight:600; text-align:center; flex:1 1 auto; }

  .divider { border:none; border-top:0.1vh solid var(--border); margin:calc(var(--scale) * 1.8vh) 0; }
  .qt-card { background:var(--panel); border:0.13vh dashed var(--border); border-radius:1.2vh; padding:calc(var(--scale) * 2.2vh); text-align:center; color:#4a5160; font-size:calc(var(--scale) * 1.6vh); font-weight:600; }
  .err-card { background:var(--urgent-bg); border:0.13vh solid var(--urgent); border-radius:1.2vh; padding:2.2vh; text-align:center; color:var(--urgent); font-size:1.8vh; font-weight:700; }
</style>
</head>

<script>
// =======================================================================
// Deployed Apps Script /exec URL. Get it from Deploy > Manage deployments
// in the Apps Script editor if you ever need to change it.
// =======================================================================
// Same-origin Netlify Function, NOT script.google.com directly. The actual
// confirmed cause of the intermittent red error card: Apps Script serves
// every response through a second redirect to script.googleusercontent.com
// carrying a short-lived one-time token, and Safari can delay following
// that redirect (background-tab throttling / ITP) just long enough for the
// token to expire — a 404 HTML page instead of JSON. That's a browser-side
// timing problem, so the real fix is having a server (which isn't subject
// to any of that) follow the redirect instead. See
// netlify/functions/board-data.js — it does that, caches briefly, and this
// page just talks to it like any other same-origin JSON endpoint.
var SCRIPT_URL = '/.netlify/functions/board-data';

// Which board this page shows comes from its own URL, e.g. index.html?board=in
var BOARD_KEY = new URLSearchParams(window.location.search).get('board') || '';

var DATA_REFRESH_MS = 30000; // how often to re-fetch the sheet
// Every TV, plus the Overview page's 6 iframes, plus both manager
// dashboards, all poll on this same interval — if their clocks are ever in
// sync (e.g. several TVs powered on together each morning) that's a burst
// of a dozen+ simultaneous requests hitting the same Apps Script deployment
// at once, which is what was causing the intermittent "Could not reach the
// Apps Script data endpoint" / JSON SyntaxError. This random jitter is
// added to (or subtracted from) DATA_REFRESH_MS on every single poll, so
// clocks that start out aligned drift apart within a poll or two instead of
// staying locked together.
var DATA_REFRESH_JITTER_MS = 8000;
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

// Dock numbers / prep zone codes are short ("6", "14-1", "2A") and fit the
// default square chip fine. Order Holding's zone names ("SHAKEDOWN NORTH",
// "COUNTRY ROADS SOUTH") are much longer — give those a wider chip with
// smaller text instead of letting them overflow/clip.
function numChipClass(num) {
  return String(num || '').length > 5 ? 'num-chip num-chip-wide' : 'num-chip';
}

// Dashboard-driven visual states: In Process (pulsing), Urgent (red),
// Complete (green — only ever reaches here for Order Fulfillment; every
// other board already dropped a completed row before it got this far),
// See MGMT (pulsing magenta — a manager flag, same pulse as In Process).
function stateClasses(item) {
  var cls = '';
  if (item.inProcess) cls += ' state-in-process';
  if (item.complete) cls += ' state-complete-green';
  if (item.urgent) cls += ' state-urgent';
  if (item.seeMgmt) cls += ' state-mgmt';
  return cls;
}

// "AISLE B & C SHAKEDOWN" -> { top: "Aisle B & C", bottom: "Shakedown" }.
// Anything typed into a zone column that matches this "AISLE x & y NAME"
// shape gets the two-line chip treatment, wherever it shows up — Prep
// Holding, and Order Fulfillment when the same zone code is used there.
// Anything that doesn't match (dock numbers, BACKLINE, rental codes, plain
// free text) falls through to the original single-line chip, unchanged.
function zoneChipParts(raw) {
  var s = String(raw || '');
  var m = s.match(/^AISLE\s+([A-Za-z0-9]+)\s*&\s*([A-Za-z0-9]+)\s+(.+)$/i);
  if (!m) return null;
  return { top: 'Aisle ' + m[1].toUpperCase() + ' & ' + m[2].toUpperCase(), bottom: titleCase(m[3]) };
}
function titleCase(s) {
  return String(s || '').toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
}
function numChipInnerHtml(num) {
  var parts = zoneChipParts(num);
  if (!parts) return esc(num);
  return '<div class="zone-chip-lines"><div class="zone-chip-top">' + esc(parts.top) + '</div>' +
    '<div class="zone-chip-bottom">' + esc(parts.bottom) + '</div></div>';
}

// Shared row-card markup for every board type: num-chip on the left, the
// description (unshrunk by anything else), an optional small meta line,
// an optional priority badge, and — for boards with truck/vehicle info
// (Inbound/Outbound Docks) — a side-chip pinned to the far right, so that
// info reads clearly instead of getting squeezed under the description.
function rowCardHtml(item) {
  var sideHtml = '';
  if (item.side && (item.side.main || item.side.sub)) {
    sideHtml = '<div class="side-chip">' +
      (item.side.main ? '<div class="side-chip-main">' + esc(item.side.main) + '</div>' : '') +
      (item.side.sub ? '<div class="side-chip-sub">' + esc(item.side.sub) + '</div>' : '') +
      '</div>';
  }
  var badgeHtml = item.badge ? '<div class="badge badge-urgent">' + esc(item.badge) + '</div>' : '';
  return '<div class="row-card' + stateClasses(item) + '"><div class="' + numChipClass(item.num) + '">' + numChipInnerHtml(item.num) + '</div>' +
    '<div class="row-main"><div class="row-desc">' + esc(item.desc) + '</div>' +
    (item.meta ? '<div class="row-meta">' + esc(item.meta) + '</div>' : '') +
    '</div>' + badgeHtml + sideHtml + '</div>';
}

function renderList(data) {
  var html = '';
  if (!data.active.length) {
    html += '<div class="qt-card">No active items right now</div>';
  } else {
    data.active.forEach(function (item) { html += rowCardHtml(item); });
  }
  if (data.open && data.open.length) {
    html += '<div class="section-label" style="margin-top:0.6vh;">Open / Unassigned</div><div class="open-wrap">';
    data.open.forEach(function (n) { html += '<div class="open-chip">' + esc(n) + '</div>'; });
    html += '</div>';
  }
  return html;
}

// Prep Holding & Rentals: two labeled sections (Prep Holding, Rentals) on
// one page, each with its own active list + Open/Unassigned chips.
function renderListDual(data) {
  var html = '';
  data.sections.forEach(function (sec, idx) {
    html += '<div class="section-label"' + (idx > 0 ? ' style="margin-top:1.6vh;"' : '') + '>' + esc(sec.label) + '</div>';
    if (!sec.active.length) {
      html += '<div class="qt-card" style="margin-bottom:0.6vh;">Nothing active</div>';
    } else {
      sec.active.forEach(function (item) { html += rowCardHtml(item); });
    }
    if (sec.open && sec.open.length) {
      html += '<div class="open-wrap" style="margin-bottom:0.6vh;">';
      sec.open.forEach(function (n) { html += '<div class="open-chip">' + esc(n) + '</div>'; });
      html += '</div>';
    }
  });
  return html;
}

function renderZoneGrid(data) {
  var html = '<div class="grid-zones">';
  data.zones.forEach(function (z) {
    html += '<div class="zone-card"><div class="zone-name">' + esc(z.name) + '</div>';
    if (z.desc) {
      html += '<div class="row-desc" style="font-size:2.3vh;">' + esc(z.desc) + '</div>';
      if (z.sub) html += '<div class="row-meta">' + esc(z.sub) + '</div>';
    } else {
      html += '<div class="zone-status-empty">Open</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderUrgentQuickturn(data) {
  var html = '<div class="section-label">Returns In Process</div>';
  if (!data.active.length) {
    html += '<div class="qt-card">No returns in process</div>';
  } else {
    data.active.forEach(function (item) { html += rowCardHtml(item); });
  }
  html += '<hr class="divider"><div class="section-label qt">Quick Turn</div>';
  if (!data.quickTurn.length) {
    html += '<div class="qt-card">No quick-turn items queued</div>';
  } else {
    // Qty/Item, In Order, and Out Order all matter and are all shown at the
    // same size now (previously Item was a small meta line under a big
    // In → Out headline, which buried the part that matters most).
    data.quickTurn.forEach(function (q) {
      html += '<div class="row-card qt"><div class="row-main">' +
        '<div class="qt-line">' + esc(q.item) + '</div>' +
        '<div class="qt-line">' + esc(q.inDesc) + ' &rarr; ' + esc(q.outDesc) + '</div>' +
        (q.needBy ? '<div class="row-meta">Need by ' + esc(q.needBy) + '</div>' : '') +
        '</div></div>';
    });
  }
  return html;
}

// Auto-fit: as more zones/rows populate, the content area can run out of
// vertical room and start clipping. Rather than a fixed size, we shrink a
// single --scale CSS variable (driving every row-card/zone-card/font size
// via calc()) step by step until everything fits, then stop — so a board
// with only a couple of active items still renders at full size, and one
// with a dozen shrinks just enough to show them all.
function fitContent() {
  var board = document.querySelector('.board');
  var content = document.getElementById('content');
  if (!board || !content) return;
  var scale = 1;
  board.style.setProperty('--scale', scale);
  var guard = 0;
  while (content.scrollHeight > content.clientHeight + 1 && scale > 0.4 && guard < 40) {
    scale = Math.max(0.4, scale - 0.03);
    board.style.setProperty('--scale', scale.toFixed(3));
    guard++;
  }
}

function updateClock() {
  var now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  document.getElementById('dateLine').textContent =
    now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
}

// A single failed/garbled poll (transient Apps Script hiccup, brief network
// blip) shouldn't blank out a board that was showing perfectly good data a
// moment ago — that's what was causing the "random error" flashes across
// different TVs. Instead: keep the last good render on screen and retry
// quietly; only show the red error card if we've never loaded successfully,
// or several polls in a row have failed.
var hasRenderedOnce = false;
var consecutiveFailures = 0;
var FAILURES_BEFORE_SHOWING_ERROR = 3;
// Confirmed root cause of the flash itself: Safari occasionally delays
// following Apps Script's second (script.googleusercontent.com) redirect
// long enough for its short-lived one-time token to expire, producing a 404
// instead of JSON. That's Safari/Google infrastructure timing, not
// something fixable here — but since a fresh poll almost always succeeds
// (a new execution gets a new token), retrying quickly instead of waiting
// out the rest of the normal ~30s cycle makes each flash much shorter and
// far less likely to ever reach FAILURES_BEFORE_SHOWING_ERROR at all.
var QUICK_RETRY_MS = 3000;

// A full page reload (e.g. the kiosk box refreshing the URL, not just this
// script's own 30s poll) has nothing to fall back on above — it starts from
// a blank page. If that reload happens to land in the middle of a brief
// outage, the board would otherwise show a red error card instead of
// whatever it last knew to be true. Caching the last successful payload in
// this browser lets a fresh page load show that instead, then quietly
// replace it the moment a real fetch succeeds.
var CACHE_KEY = 'bnp_board_cache_' + BOARD_KEY;

function readCachedPayload() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function writeCachedPayload(payload) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
  } catch (e) {
    // storage full/unavailable/private-mode — fine, just skip caching
  }
}

function renderPayload(payload, opts) {
  opts = opts || {};
  document.getElementById('zoneTitle').textContent = payload.cfg.title;
  document.getElementById('zoneSub').textContent = payload.cfg.sub || '';
  var html = '';
  if (payload.cfg.type === 'list' || payload.cfg.type === 'flag_list') html = renderList(payload.data);
  else if (payload.cfg.type === 'list_dual') html = renderListDual(payload.data);
  else if (payload.cfg.type === 'zone_grid') html = renderZoneGrid(payload.data);
  else if (payload.cfg.type === 'urgent_quickturn') html = renderUrgentQuickturn(payload.data);
  var content = document.getElementById('content');
  var apply = function () {
    content.innerHTML = html;
    content.style.opacity = 1;
    // Wait a frame so the browser has laid out the new content before
    // measuring it for auto-fit.
    requestAnimationFrame(function () { requestAnimationFrame(fitContent); });
  };
  if (opts.fade) {
    content.style.opacity = 0;
    setTimeout(apply, 150);
  } else {
    apply();
  }
  document.getElementById('footerNote').textContent =
    'Live from Warehouse Ops sheet &middot; refreshes every ' + Math.round(DATA_REFRESH_MS / 1000) + 's &middot; updated ' + payload.generatedAt +
    (opts.stale ? ' (last known data — refreshing…)' : '');
}

function loadData() {
  if (!SCRIPT_URL) {
    document.getElementById('content').innerHTML =
      '<div class="err-card">Set SCRIPT_URL at the top of index.html to your deployed Apps Script URL.</div>';
    return;
  }
  if (!BOARD_KEY) {
    document.getElementById('content').innerHTML =
      '<div class="err-card">No board specified &mdash; add ?board=in (or out / prep / order_processing / orderholding / rental) to this page\'s URL.</div>';
    return;
  }
  var url = SCRIPT_URL + '?format=json&board=' + encodeURIComponent(BOARD_KEY) + '&_=' + Date.now();
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (payload) {
      if (payload.error) { throw new Error(payload.error); }
      consecutiveFailures = 0;
      hasRenderedOnce = true;
      renderPayload(payload, { fade: true });
      writeCachedPayload(payload);
    })
    .catch(function (err) {
      consecutiveFailures++;
      console.warn('Board poll failed (' + consecutiveFailures + ' in a row):', err);
      if (hasRenderedOnce && consecutiveFailures < FAILURES_BEFORE_SHOWING_ERROR) {
        // Keep showing the last good board, and try again in a few seconds
        // rather than waiting out the rest of the ~30s cycle — most of
        // these clear on the very next attempt (see QUICK_RETRY_MS above).
        // The regularly-scheduled poll still fires on its own timer too;
        // this is a purely additive early attempt, not a replacement for it.
        setTimeout(loadData, QUICK_RETRY_MS);
        return;
      }
      document.getElementById('content').innerHTML =
        '<div class="err-card">Could not reach the Apps Script data endpoint. Check SCRIPT_URL and that the deployment allows anonymous access.<br><br>' + esc(err) + '</div>';
    });
}

updateClock();
setInterval(updateClock, 1000);

// Show whatever this browser last knew to be true immediately on page load,
// before the first live fetch even resolves — turns "blank/error for a few
// seconds on every reload" into "last known board, instantly."
(function rehydrateFromCache() {
  if (!BOARD_KEY) return;
  var cached = readCachedPayload();
  if (cached) {
    hasRenderedOnce = true;
    renderPayload(cached, { stale: true });
  }
})();

function scheduleNextLoad() {
  var jitter = Math.floor(Math.random() * DATA_REFRESH_JITTER_MS) - (DATA_REFRESH_JITTER_MS / 2);
  var delay = Math.max(5000, DATA_REFRESH_MS + jitter);
  setTimeout(function () { loadData(); scheduleNextLoad(); }, delay);
}

loadData();
scheduleNextLoad();
</script>
</body>
</html>
