<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNP &middot; All Zones (Desk Preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:#05070a; height:100%; }
  * { box-sizing:border-box; font-family:'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { flex:0 0 auto; padding:14px 20px; color:#8B93A1; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; border-bottom:1px solid #262B33; }
  header span { color:#E8A33D; }
  .grid { flex:1 1 auto; display:grid; grid-template-columns:repeat(3, 1fr); grid-template-rows:repeat(2, 1fr); gap:10px; padding:10px; min-height:0; }
  .tile { position:relative; border:1px solid #262B33; border-radius:10px; overflow:hidden; background:#0B0D10; }
  .tile iframe { width:100%; height:100%; border:0; }
</style>
</head>
<body>
<header>Brown Note Productions &middot; <span>Desk Preview</span> &mdash; this mirrors what's live on all six TVs, view-only</header>
<div class="grid">
  <div class="tile"><iframe src="index.html?board=in"></iframe></div>
  <div class="tile"><iframe src="index.html?board=order_processing"></iframe></div>
  <div class="tile"><iframe src="index.html?board=order_fulfillment"></iframe></div>
  <div class="tile"><iframe src="index.html?board=prep"></iframe></div>
  <div class="tile"><iframe src="index.html?board=prep_holding_rentals"></iframe></div>
  <div class="tile"><iframe src="index.html?board=out"></iframe></div>
</div>
</body>
</html>
